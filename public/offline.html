<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Volt — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #18181b; color: #fff; font-family: 'Jost', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100dvh; text-align: center; padding: 2rem; }
    .container { max-width: 320px; }
    h1 { font-size: 1.5rem; font-weight: 900; margin-bottom: 0.5rem; }
    p { color: #9ca3af; font-size: 0.875rem; margin-bottom: 1.5rem; }
    button { background: #eafc23; color: #18181b; font-weight: 700; border: none; padding: 0.75rem 2rem; border-radius: 0.75rem; font-size: 0.875rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h1>You're offline</h1>
    <p>Check your connection and try again.</p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
